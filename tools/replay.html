<!doctype html>
<meta charset="utf-8">
<title>ConLogs Replay (prototype)</title>
<style>
  body { margin:0; background:#0d0f13; color:#cdd3dc; font:13px/1.4 system-ui,Segoe UI,sans-serif; }
  #wrap { display:flex; gap:12px; padding:12px; }
  #stage { position:relative; }
  canvas { background:#000; border:1px solid #2a2f3a; display:block; }
  #side { width:200px; }
  .row { display:flex; align-items:center; gap:6px; padding:2px 0; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px; }
  #scrub { flex:1; }
  button { background:#1b1f27; color:#cdd3dc; border:1px solid #2a2f3a; border-radius:5px; padding:4px 10px; cursor:pointer; }
  button.on { border-color:#e5cc80; color:#e5cc80; }
  h3 { margin:0 0 6px; font-size:12px; color:#8b93a1; text-transform:uppercase; letter-spacing:.04em; }
  #t { font-variant-numeric:tabular-nums; color:#8b93a1; min-width:90px; }
</style>
<div id="bar">
  <button id="play">▶ Play</button>
  <span id="speedbtns">
    <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button>
    <button data-s="2">2×</button><button data-s="4">4×</button>
  </span>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="t">0.0s / 0.0s</span>
</div>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1024" height="768"></canvas></div>
  <div id="side"><h3>Players</h3><div id="legend"></div></div>
</div>

<!-- The decoder writes track.js (window.TRACK). If absent, a mock track is used. -->
<script src="track.js" onerror="void 0"></script>
<script>
const CLASS_COLORS = {
  WARRIOR:"#C79C6E", MAGE:"#69CCF0", ROGUE:"#FFF569", DRUID:"#FF7D0A", HUNTER:"#ABD473",
  SHAMAN:"#0070DE", PRIEST:"#FFFFFF", WARLOCK:"#9482C9", PALADIN:"#F58CBA", DEATHKNIGHT:"#C41F3B",
};
// Calibration: where 0..1 coords map inside the map image. Per-map, since each
// map's decorative border differs. NetherstormArena slot = PE's custom "Gillijim's
// Isle" BG (override tiles from patch-Y); full-image fit verified against a real log.
const INSETS = {
  NetherstormArena: { x0:0, y0:0, x1:1, y1:1 },
  WarsongGulch:     { x0:0.16, y0:0.10, x1:0.84, y1:0.90 },  // estimate; refine with a real WSG track
};
const INSET = INSETS[TRACK.map] || { x0:0, y0:0, x1:1, y1:1 };

// ---- mock fallback so the prototype is visible without a real log ----
function mockTrack() {
  const guids = ["g1","g2","g3","g4","g5"];
  const cls = {g1:"HUNTER",g2:"WARRIOR",g3:"MAGE",g4:"PRIEST",g5:"PALADIN"};
  const names = {g1:"Defcom",g2:"Saws",g3:"Bede",g4:"Judha",g5:"Moxyer"};
  const snaps = [];
  for (let i=0;i<=60;i++){ const t=i*500; const u=guids.map((g,k)=>({g,
     x:0.5+0.28*Math.cos(i/8+k), y:0.5+0.28*Math.sin(i/8+k*1.3)})); snaps.push({t,units:u}); }
  return { map:"WarsongGulch", classMap:cls, names, snapshots:snaps };
}
const TRACK = window.TRACK || mockTrack();

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const bg = new Image(); bg.src = (TRACK.map || "WarsongGulch") + ".png";
bg.onload = () => { cv.width = bg.naturalWidth||1024; cv.height = bg.naturalHeight||768; render(); };

const snaps = TRACK.snapshots.slice().sort((a,b)=>a.t-b.t);
const t0 = snaps.length?snaps[0].t:0, tN = snaps.length?snaps[snaps.length-1].t:0;
const dur = Math.max(1, tN - t0);
let cur = 0, playing = false, speed = 1, last = 0;

function px(x,y){ return [ (INSET.x0+(INSET.x1-INSET.x0)*x)*cv.width,
                           (INSET.y0+(INSET.y1-INSET.y0)*y)*cv.height ]; }

function posAt(guid, t){
  let a=null,b=null;
  for (const s of snaps){ const u=s.units.find(z=>z.g===guid); if(!u) continue;
    if (s.t<=t){ a={t:s.t,u}; } else { b={t:s.t,u}; break; } }
  if (a&&b){ const f=(t-a.t)/(b.t-a.t||1); return [a.u.x+(b.u.x-a.u.x)*f, a.u.y+(b.u.y-a.u.y)*f]; }
  if (a) return [a.u.x,a.u.y]; if (b) return [b.u.x,b.u.y]; return null;
}

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if (bg.complete) ctx.drawImage(bg,0,0,cv.width,cv.height);
  const guids = Object.keys(TRACK.classMap||{}).length ? Object.keys(TRACK.classMap)
                : [...new Set(snaps.flatMap(s=>s.units.map(u=>u.g)))];
  for (const g of guids){
    const p = posAt(g, t0+cur); if(!p) continue;
    const [X,Y]=px(p[0],p[1]); const col=CLASS_COLORS[(TRACK.classMap||{})[g]]||"#cccccc";
    ctx.beginPath(); ctx.arc(X,Y,7,0,7); ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="#000"; ctx.stroke();
  }
  document.getElementById('t').textContent = (cur/1000).toFixed(1)+"s / "+(dur/1000).toFixed(1)+"s";
  document.getElementById('scrub').value = Math.round(cur/dur*1000);
}

function loop(ts){ if(playing){ if(!last) last=ts; cur+=(ts-last)*speed; last=ts;
  if(cur>=dur){ cur=dur; playing=false; document.getElementById('play').textContent="▶ Play"; }
  render(); } else last=0; requestAnimationFrame(loop); }
requestAnimationFrame(loop);

document.getElementById('play').onclick = e => { playing=!playing; if(cur>=dur)cur=0;
  e.target.textContent = playing?"⏸ Pause":"▶ Play"; last=0; };
document.getElementById('scrub').oninput = e => { cur=e.target.value/1000*dur; render(); };
document.querySelectorAll('#speedbtns button').forEach(b=>b.onclick=()=>{ speed=+b.dataset.s;
  document.querySelectorAll('#speedbtns button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });

// legend
const leg=document.getElementById('legend');
const guids = Object.keys(TRACK.classMap||{}).length?Object.keys(TRACK.classMap)
              :[...new Set(snaps.flatMap(s=>s.units.map(u=>u.g)))];
for(const g of guids){ const c=CLASS_COLORS[(TRACK.classMap||{})[g]]||"#ccc";
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<span class="dot" style="background:${c}"></span>${(TRACK.names||{})[g]||g}`;
  leg.appendChild(d); }
</script>
